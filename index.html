<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graph Coloring Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Graph Coloring Simulator</h1>
<p class="sub">Build a graph, then watch algorithms assign colors so no two connected nodes match.</p>
<div class="layout">
 <div class="card">
  <div class="row" id="tools"></div>
  <svg id="g" viewBox="0 0 800 520"></svg>
  <p class="hint" id="hint"></p>
  <div class="row" style="margin-top:10px">
   <label>Presets</label>
   <select id="preset">
    <option value="" selected>Choose…</option><option>Petersen</option><option>K5</option><option>Wheel W6</option><option>Odd cycle C7</option><option>Bipartite K3,3</option><option>Random</option>
   </select>
   <button id="clear">Clear graph</button>
   <button id="uncolor">Reset colors</button>
  </div>
 </div>
 <div class="card">
  <div class="row">
   <select id="algo">
    <option value="greedy">Greedy (node order)</option>
    <option value="wp">Welsh–Powell</option>
    <option value="dsatur">DSATUR</option>
    <option value="bt">Backtracking (exact)</option>
   </select>
  </div>
  <div class="row">
   <button class="primary" id="run">▶ Run</button>
   <button id="step">Step</button>
   <button id="stop">Stop</button>
  </div>
  <div class="row"><label>Speed</label><input type="range" id="speed" min="1" max="100" value="55"></div>
  <div class="stats">
   <div class="stat"><b id="sColors">0</b><span>colors used</span></div>
   <div class="stat"><b id="sConf">0</b><span>conflicts</span></div>
   <div class="stat"><b id="sBound">–</b><span>upper bound Δ+1</span></div>
   <div class="stat"><b id="sSteps">0</b><span>steps</span></div>
  </div>
  <div class="legend" id="legend"></div>
  <div id="log"></div>
 </div>
</div>
</main>
<script src="app.js"></script>
</body>
</html>
